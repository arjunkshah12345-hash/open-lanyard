<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef1f5" />
    <meta name="description" content="Arjun Shah's SuperCompress badge. An interactive 3D lanyard, yours to customize." />
    <title>SuperCompress · Arjun Shah</title>
    <link rel="icon" href="./brand-mark.svg" type="image/svg+xml" />
  </head>
  <body class="light">
    <main class="experience">
      <div class="studio" aria-hidden="true"></div>
      <header class="topbar">
        <a class="wordmark" href="https://supercompress.dev" target="_blank" rel="noopener noreferrer" aria-label="SuperCompress website"><img src="./brand-mark.svg" alt="" /><span>Super<span class="wordmark-dot">Compress</span></span></a>
        <button class="edit-button" id="edit-button" aria-expanded="false" aria-controls="editor"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m12.5 4 3.5 3.5M3 17l4-.8L16 7.3a2.5 2.5 0 0 0-3.5-3.5L3.8 13z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Make it yours</button>
      </header>

      <div id="scene" class="scene" tabindex="0" role="group" aria-label="Interactive hanging badge. Drag to swing. Arrow keys swing, Space spins, R resets.">
        <div class="loading" id="loading"><span class="loading-ring"></span><span>Hanging your badge…</span></div>
      </div>

      <aside id="editor" class="editor" aria-label="Customize your badge" hidden>
        <div class="editor-head"><div><span class="eyebrow">YOUR ALL-ACCESS PASS</span><h1>Make an entrance.</h1></div><button id="close-editor" class="icon-button" aria-label="Close editor">×</button></div>
        <form id="badge-form">
          <label>Your name<input name="name" maxlength="28" autocomplete="off" /></label>
          <label>What you do<input name="role" maxlength="34" autocomplete="off" /></label>
          <div class="fields-row"><label>Brand<input name="brand" maxlength="16" autocomplete="off" /></label><label>Badge number<input name="serial" maxlength="6" autocomplete="off" /></label></div>
          <label>On the strap<input name="strap" maxlength="18" autocomplete="off" /></label>
          <label>Website<input name="website" maxlength="36" autocomplete="off" /></label>
          <fieldset><legend>Find your color</legend><div class="swatches">
            <button type="button" class="swatch" data-color="#0566ff" style="--swatch:#0566ff" aria-label="SuperCompress blue" aria-pressed="true"></button>
            <button type="button" class="swatch" data-color="#bcb1f7" style="--swatch:#bcb1f7" aria-label="Lilac" aria-pressed="false"></button>
            <button type="button" class="swatch" data-color="#f5a987" style="--swatch:#f5a987" aria-label="Apricot" aria-pressed="false"></button>
            <button type="button" class="swatch" data-color="#87cfec" style="--swatch:#87cfec" aria-label="Glacier" aria-pressed="false"></button>
            <label class="custom-color" title="Choose any color"><input type="color" name="accent" aria-label="Custom badge color" /><span>+</span></label>
          </div></fieldset>
          <button class="download-button" id="download-config" type="button">Download your config <span aria-hidden="true">↗</span></button>
          <p class="editor-note">Yours to edit. Yours to build on.</p>
        </form>
      </aside>

      <footer class="bottom-bar">
        <div class="open-note"><span class="open-dot"></span>Open source. Open possibilities.</div>
        <div class="play-hint"><span class="hint-hand" aria-hidden="true">↙</span><span id="hint">Give it a little pull.</span></div>
        <div class="actions"><button id="spin" aria-label="Spin the badge" title="Spin · Space"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 7a7 7 0 1 0 1 9M18 3v5h-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="reset" aria-label="Reset the badge" title="Reset · R"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 5v5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="theme" aria-label="Switch to dark studio" title="Switch studio lighting"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div>
      </footer>
      <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
